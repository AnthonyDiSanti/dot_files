# Solarized colors taken from the iTerm2 project.
#
# Dark Background Tones
# ---------------------
# Base03 = #002B36
# Base02 = #073642
#
# Content Tones
# -------------
# Base01 = #586E75
# Base00 = #657B83
# Base0 = #839496
# Base1 = #93A1A1
#
# Light Background Tones
# ----------------------
# Base2 = #EEE8D5
# Base3 = #FDF6E3
#
# Accent Colors
# -------------
# Yellow = #B58900
# Orange = #CB4B16
# Red = #D30102
# Magenta = #D33682
# Violet = #6C71C4
# Blue = #268BD2
# Cyan = #2AA198
# Green = #859900

# Advertise modern tmux capabilities to inner shells and TUIs.
set -g default-terminal "tmux-256color"

# Empty default-command restores tmux's login-shell behavior before optional overrides.
set -g default-command ''
if-shell 'command -v zsh >/dev/null 2>&1' {
  set -g default-command 'exec zsh -il'
} {
  if-shell 'command -v bash >/dev/null 2>&1' {
    set -g default-command 'exec bash -il'
  }
}

# Pass RGB through to inner apps (Vim + termguicolors / Solarized 8). tmux 3.2+.
set -sa terminal-features ',*:RGB'

# Normal tmux clients get focus events and aggressive resize at attach time.
# The shell wrapper marks tmux -CC startup so control mode can stay compatible.
if -F '#{client_control_mode}' {
  set -g focus-events off
  setw -g aggressive-resize off
} {
  if-shell 'test "${DOTFILES_TMUX_CONTROL_MODE:-}" = 1' {
    set -g focus-events off
    setw -g aggressive-resize off
  } {
    set -g focus-events on
    setw -g aggressive-resize on
  }
}

# Keep Esc responsive for Vim, zsh vi mode, and copy-mode commands inside tmux.
set -sg escape-time 10

# Increase scrollback.
set -g history-limit 100000

# Start window and pane numbering at 1, and close gaps after windows exit.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support.
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Customize the status bar.
set -g status-style bg='#FDF6E3',fg='#657B83' # Solarized Base3 / Base00
set -g window-status-current-style fg='#268BD2' # Solarized Blue
set -g status-left-length 20

# Preserve tmux's normal bell behavior; focus-events is the control-mode concern.
set -g bell-action any
setw -g monitor-bell on

if-shell 'test -x ~/.local/bin/dotfiles-tmux-control-mode-options' {
  set-hook -g client-attached 'run-shell ~/.local/bin/dotfiles-tmux-control-mode-options'
  set-hook -g client-detached 'run-shell ~/.local/bin/dotfiles-tmux-control-mode-options'

  if -F '#{client_name}' {
    run-shell ~/.local/bin/dotfiles-tmux-control-mode-options
  }
}

# Use Vim bindings in tmux prompts and copy mode.
set -g status-keys vi
setw -g mode-keys vi

# Tmux exposes rectangle state but not char-vs-line state, so track selections
# started by these bindings to make v/V/C-v toggle closer to Vim visual modes.
bind -N 'Clear selection' -T copy-mode-vi Escape send-keys -X clear-selection \; set -p @dotfiles_copy_selection_mode '' \; refresh-client
bind -N 'Begin character selection' -T copy-mode-vi Space send-keys -X begin-selection \; send-keys -X rectangle-off \; send-keys -X selection-mode char \; set -p @dotfiles_copy_selection_mode char \; refresh-client
bind -N 'Toggle character selection' -T copy-mode-vi v if -F '#{selection_active}' {
  if -F '#{&&:#{==:#{@dotfiles_copy_selection_mode},char},#{==:#{rectangle_toggle},0}}' {
    send-keys -X clear-selection
    set -p @dotfiles_copy_selection_mode ''
    refresh-client
  } {
    send-keys -X rectangle-off
    send-keys -X selection-mode char
    set -p @dotfiles_copy_selection_mode char
    refresh-client
  }
} {
  send-keys -X begin-selection
  send-keys -X rectangle-off
  send-keys -X selection-mode char
  set -p @dotfiles_copy_selection_mode char
  refresh-client
}
bind -N 'Toggle line selection' -T copy-mode-vi V if -F '#{selection_active}' {
  if -F '#{&&:#{==:#{@dotfiles_copy_selection_mode},line},#{==:#{rectangle_toggle},0}}' {
    send-keys -X clear-selection
    set -p @dotfiles_copy_selection_mode ''
    refresh-client
  } {
    send-keys -X rectangle-off
    send-keys -X selection-mode line
    set -p @dotfiles_copy_selection_mode line
    refresh-client
  }
} {
  send-keys -X rectangle-off
  send-keys -X select-line
  set -p @dotfiles_copy_selection_mode line
  refresh-client
}
bind -N 'Toggle rectangle selection' -T copy-mode-vi C-v if -F '#{selection_active}' {
  if -F '#{&&:#{==:#{@dotfiles_copy_selection_mode},rectangle},#{rectangle_toggle}}' {
    send-keys -X clear-selection
    set -p @dotfiles_copy_selection_mode ''
    refresh-client
  } {
    send-keys -X rectangle-on
    send-keys -X selection-mode char
    set -p @dotfiles_copy_selection_mode rectangle
    refresh-client
  }
} {
  send-keys -X begin-selection
  send-keys -X rectangle-on
  send-keys -X selection-mode char
  set -p @dotfiles_copy_selection_mode rectangle
  refresh-client
}
bind -N 'Copy selection to tmux and platform clipboard' -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'dotfiles-clipboard-tmux copy' \; set -p @dotfiles_copy_selection_mode ''
bind -N 'Copy selection to tmux and platform clipboard' -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'dotfiles-clipboard-tmux copy' \; set -p @dotfiles_copy_selection_mode ''
bind -N 'Page up' -T copy-mode-vi u send-keys -X page-up
bind -N 'Half-page up' -T copy-mode-vi C-u send-keys -X halfpage-up
bind -N 'Page down' -T copy-mode-vi d send-keys -X page-down
bind -N 'Half-page down' -T copy-mode-vi C-d send-keys -X halfpage-down

# Window management bindings.
bind -N 'Create a new window in the current pane directory' c new-window -c "#{pane_current_path}"
bind -N 'Switch to the last window' b last-window
bind -N 'Switch to the last window' C-b last-window
bind -N 'Reload tmux config' R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind -N 'Paste from platform clipboard through tmux' ] run-shell 'dotfiles-clipboard-tmux paste'
bind -N 'Import platform clipboard into tmux buffer' C-y run-shell 'dotfiles-clipboard-tmux import'

# Pane creation bindings.
bind -N 'Split pane left/right in the current directory' v    split-window -h -c "#{pane_current_path}"
bind -N 'Split pane left/right in the current directory' V    split-window -h -c "#{pane_current_path}"
bind -N 'Split pane left/right in the current directory' C-v  split-window -h -c "#{pane_current_path}"
bind -N 'Split pane top/bottom in the current directory' -    split-window -v -c "#{pane_current_path}"

# Vim hotkeys for pane navigation/resizing.
bind -N 'Select pane above' -r k select-pane -U
bind -N 'Select pane below' -r j select-pane -D
bind -N 'Select pane left' -r h select-pane -L
bind -N 'Select pane right' -r l select-pane -R

bind -N 'Resize pane upward' -r C-k resize-pane -U
bind -N 'Resize pane downward' -r C-j resize-pane -D
bind -N 'Resize pane left' -r C-h resize-pane -L
bind -N 'Resize pane right' -r C-l resize-pane -R

# Copy the current tmux paste buffer to the platform clipboard when available.
bind -N 'Copy current tmux buffer to platform clipboard' y run-shell 'tmux save-buffer - | dotfiles-clipboard-tmux copy'
