# Solarized colors taken from the iTerm2 project.
#
# Dark Background Tones
# ---------------------
# Base03 = #002B36
# Base02 = #073642
#
# Content Tones
# -------------
# Base01 = #586E75
# Base00 = #657B83
# Base0 = #839496
# Base1 = #93A1A1
#
# Light Background Tones
# ----------------------
# Base2 = #EEE8D5
# Base3 = #FDF6E3
#
# Accent Colors
# -------------
# Yellow = #B58900
# Orange = #CB4B16
# Red = #D30102
# Magenta = #D33682
# Violet = #6C71C4
# Blue = #268BD2
# Cyan = #2AA198
# Green = #859900

# Advertise modern tmux capabilities to inner shells and TUIs.
set -g default-terminal "tmux-256color"

# Pass RGB through to inner apps (Vim + termguicolors / Solarized 8). tmux 3.2+.
set -sa terminal-features ',*:RGB'

# Keep Esc responsive for Vim, zsh vi mode, and copy-mode commands inside tmux.
set -sg escape-time 10

# Increase scrollback.
set -g history-limit 100000

# Start window and pane numbering at 1, and close gaps after windows exit.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support.
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Customize the status bar.
set -g status-style bg='#FDF6E3',fg='#657B83' # Solarized Base3 / Base00
set -g window-status-current-style fg='#268BD2' # Solarized Blue
set -g status-left-length 20

# Fix annoying resizing from inactive clients.
set -g aggressive-resize on

# Customize copy mode to use Vim bindings and the platform clipboard wrapper.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'dotfiles-clipboard-tmux copy'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'dotfiles-clipboard-tmux copy'
bind -T copy-mode-vi u send-keys -X page-up
bind -T copy-mode-vi C-u send-keys -X page-up
bind -T copy-mode-vi d send-keys -X page-down
bind -T copy-mode-vi C-d send-keys -X page-down

# Window management bindings.
bind b last-window
bind C-b last-window
bind ] run-shell 'dotfiles-clipboard-tmux paste'
bind C-y run-shell 'dotfiles-clipboard-tmux import'

# Pane creation bindings.
bind v    split-window -h
bind V    split-window -h
bind C-v  split-window -h
bind i    split-window -v
bind I    split-window -v
bind C-i  split-window -v

# Vim hotkeys for pane navigation/resizing.
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Copy the current tmux paste buffer to the platform clipboard when available.
bind y run-shell 'tmux save-buffer - | dotfiles-clipboard-tmux copy'
