approval_policy = 'never'
model = 'gpt-5.4'
model_reasoning_effort = 'xhigh'
sandbox_mode = 'workspace-write'
show_raw_agent_reasoning = true
web_search = "live"
personality = "pragmatic"

[features]
shell_snapshot = true
shell_tool = true
undo = true
multi_agent = true
js_repl = true

[mcp_servers]
[mcp_servers.MCP_DOCKER]
command = 'docker'
args = ['mcp', 'gateway', 'run']

[notice]
[notice.model_migrations]
'gpt-5.1-codex-max' = 'gpt-5.4'
'gpt-5.1-codex' = 'gpt-5.4'
'gpt-5.3-codex' = 'gpt-5.4'

[projects]
[projects.'/Users/anthony/code/decrypto-discord']
trust_level = 'trusted'

[projects.'/Users/anthony/code/personal-assistant']
trust_level = 'trusted'

[projects."/Users/anthony/code/ops"]
trust_level = "trusted"

[projects."/Users/anthony/code/openclaw"]
trust_level = "trusted"

[projects."/Users/anthony/code/openclaw-config"]
trust_level = "trusted"

[sandbox_workspace_write]
network_access = true

[plugins."github@openai-curated"]
enabled = true
